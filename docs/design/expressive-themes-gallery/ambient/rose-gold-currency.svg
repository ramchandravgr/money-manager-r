<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="rgBillFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b4b8" stop-opacity="0.09"/>
      <stop offset="50%" stop-color="#fdf2f8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#9d6b8a" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="rgCoin" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#f5e6dc" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#e8b4b8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c9a0a8" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="rgSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g opacity="0.95" filter="url(#rgSoft)">
    <!-- Scattered banknote silhouettes (no real currency art) -->
    <g transform="translate(28 72) rotate(-11)" opacity="0.42">
      <rect x="0" y="0" width="148" height="62" rx="8" fill="url(#rgBillFill)" stroke="#6b4e5d" stroke-opacity="0.22" stroke-width="1"/>
      <rect x="14" y="14" width="68" height="6" rx="2" fill="#6b4e5d" fill-opacity="0.1"/>
      <rect x="14" y="26" width="108" height="4" rx="1" fill="#6b4e5d" fill-opacity="0.07"/>
      <rect x="14" y="36" width="88" height="4" rx="1" fill="#6b4e5d" fill-opacity="0.06"/>
      <circle cx="118" cy="31" r="14" fill="none" stroke="#db7093" stroke-opacity="0.2" stroke-width="1.2"/>
    </g>
    <g transform="translate(168 180) rotate(8)" opacity="0.38">
      <rect x="0" y="0" width="158" height="68" rx="8" fill="url(#rgBillFill)" stroke="#9d6b8a" stroke-opacity="0.2" stroke-width="1"/>
      <path d="M12 22 h134 M12 34 h96 M12 46 h110" stroke="#6b4e5d" stroke-opacity="0.1" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="118" y="18" width="26" height="32" rx="3" fill="none" stroke="#db7093" stroke-opacity="0.18" stroke-width="1"/>
    </g>
    <g transform="translate(12 320) rotate(-6)" opacity="0.34">
      <rect x="0" y="0" width="152" height="58" rx="8" fill="url(#rgBillFill)" stroke="#6b4e5d" stroke-opacity="0.18" stroke-width="1"/>
      <rect x="16" y="16" width="56" height="28" rx="3" fill="#e8b4b8" fill-opacity="0.06" stroke="#9d6b8a" stroke-opacity="0.12" stroke-width="0.8"/>
    </g>
    <g transform="translate(196 380) rotate(14)" opacity="0.36">
      <rect x="0" y="0" width="142" height="60" rx="7" fill="url(#rgBillFill)" stroke="#9d6b8a" stroke-opacity="0.16" stroke-width="1"/>
      <line x1="18" y1="22" x2="124" y2="22" stroke="#6b4e5d" stroke-opacity="0.09" stroke-width="1"/>
      <line x1="18" y1="32" x2="98" y2="32" stroke="#6b4e5d" stroke-opacity="0.08" stroke-width="1"/>
    </g>
    <!-- Coins -->
    <g transform="translate(248 96)" opacity="0.5">
      <circle cx="22" cy="22" r="20" fill="url(#rgCoin)" stroke="#9d6b8a" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="22" cy="22" r="13" fill="none" stroke="#6b4e5d" stroke-opacity="0.2" stroke-width="0.9"/>
      <circle cx="22" cy="22" r="5" fill="#6b4e5d" fill-opacity="0.12"/>
    </g>
    <g transform="translate(52 220)" opacity="0.42">
      <circle cx="18" cy="18" r="17" fill="url(#rgCoin)" stroke="#9d6b8a" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="18" cy="18" r="10" fill="none" stroke="#6b4e5d" stroke-opacity="0.18" stroke-width="0.8"/>
    </g>
    <g transform="translate(270 480)" opacity="0.44">
      <circle cx="24" cy="24" r="22" fill="url(#rgCoin)" stroke="#db7093" stroke-opacity="0.25" stroke-width="1.1"/>
      <circle cx="24" cy="24" r="14" fill="none" stroke="#6b4e5d" stroke-opacity="0.16" stroke-width="0.85"/>
    </g>
    <g transform="translate(100 520)" opacity="0.38">
      <circle cx="16" cy="16" r="15" fill="url(#rgCoin)" stroke="#9d6b8a" stroke-opacity="0.28" stroke-width="1"/>
    </g>
  </g>
</svg>
